[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stig-automator"
version = "0.3.0"
description = "Evaluate Terraform plans against DISA STIG controls for Azure and AWS resources"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "DISCLAIMER.md"]
authors = [{name = "Keith Chason"}]
readme = "README.md"
keywords = ["stig", "disa", "terraform", "compliance", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/kchason/iac-stig-automator"
Repository = "https://github.com/kchason/iac-stig-automator"
"Issue Tracker" = "https://github.com/kchason/iac-stig-automator/issues"
Changelog = "https://github.com/kchason/iac-stig-automator/blob/main/CHANGELOG.md"

[project.scripts]
stig-check = "stig_automator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.5.0",
    "pre-commit>=3.0",
    "flake8>=7.0",
    "flake8-docstrings>=1.7",
    "flake8-annotations>=3.0",
    "autoflake>=2.0",
    "jsonschema>=4.25.1",
    "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stig_automator.modules" = ["stigs/*.json", "mappings/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
